<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nehal AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#202123;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100dvh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#f7f7f8;
    border-right:1px solid #ddd;
    padding:12px;
}

.new-chat{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    background:white;
    font-size:15px;
    cursor:pointer;
}

.new-chat:hover{
    background:#eee;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.header{
    height:60px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
    font-size:18px;
    font-weight:bold;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 15%;
}

.welcome{
    text-align:center;
    margin-top:18vh;
}

.welcome h1{
    font-size:32px;
    margin-bottom:10px;
}

.welcome p{
    color:#777;
}

/* MESSAGE */

.message{
    display:flex;
    gap:14px;
    margin-bottom:25px;
}

.avatar{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#10a37f;
    color:white;
    font-weight:bold;
}

.user .avatar{
    background:#555;
}

.content{
    max-width:800px;
    line-height:1.6;
    white-space:pre-wrap;
}

/* INPUT */

.input-area{
    padding:15px 15%;
    border-top:1px solid #ddd;
}

.input-box{
    display:flex;
    align-items:flex-end;
    border:1px solid #aaa;
    border-radius:14px;
    padding:7px;
    background:white;
}

textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    padding:10px;
    font-size:16px;
    max-height:150px;
}

.send{
    width:44px;
    height:44px;
    border:none;
    border-radius:10px;
    background:#10a37f;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send:hover{
    background:#0b8c6d;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .chat{
        padding:20px 12px;
    }

    .input-area{
        padding:10px;
    }

    .welcome h1{
        font-size:27px;
    }
}

</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

    </aside>


    <main class="main">

        <header class="header">
            🤖 Nehal AI
        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <h1>How can I help you?</h1>

                <p>Ask me anything.</p>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="message"
                    rows="1"
                    placeholder="Message Nehal AI..."
                    onkeydown="handleKey(event)">
                </textarea>

                <button
                    class="send"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

const chat =
document.getElementById("chat");

const message =
document.getElementById("message");

let history = [];


function addMessage(role,text){

    const row =
    document.createElement("div");

    row.className =
    "message " + role;


    const avatar =
    document.createElement("div");

    avatar.className="avatar";

    avatar.textContent =
    role === "user" ? "U" : "AI";


    const content =
    document.createElement("div");

    content.className="content";

    content.textContent=text;


    row.appendChild(avatar);

    row.appendChild(content);

    chat.appendChild(row);

    chat.scrollTop =
    chat.scrollHeight;
}


async function sendMessage(){

    const text =
    message.value.trim();

    if(!text) return;


    document
    .getElementById("welcome")
    ?.remove();


    message.value="";


    addMessage(
        "user",
        text
    );


    try{

        const response =
        await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                message:text,

                history:history

            })

        });


        const data =
        await response.json();


        if(data.error){

            addMessage(
                "ai",
                "❌ AI Error: " +
                data.error
            );

            return;
        }


        addMessage(
            "ai",
            data.answer
        );


        history.push({

            role:"user",

            content:text

        });


        history.push({

            role:"assistant",

            content:data.answer

        });


    }catch(error){

        addMessage(
            "ai",
            "❌ Server-এর সাথে connection হয়নি।"
        );

        console.error(error);

    }

}


function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


function newChat(){

    history=[];

    chat.innerHTML=`

        <div class="welcome">

            <h1>How can I help you?</h1>

            <p>Ask me anything.</p>

        </div>

    `;

}

</script>

</body>
</html>
